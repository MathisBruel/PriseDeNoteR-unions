server {
    listen 80;
    client_max_body_size 20m;
    root /usr/share/nginx/html;

    # Résolution DNS différée : nginx démarre même si un service n'est pas encore prêt.
    resolver 127.0.0.11 valid=10s;
    set $api http://api:8000;
    set $bot http://bot:6080;

    location /api/ {
        proxy_pass $api;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    location /ws/ {
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    # Écran noVNC du bot (connexion Google) : réservé à l'administrateur connecté.
    location = /_auth {
        internal;
        proxy_pass $api/api/auth/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
    }
    location /novnc/ {
        auth_request /_auth;
        rewrite ^/novnc/(.*)$ /$1 break;
        proxy_pass $bot;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    location / {
        try_files $uri /index.html;
    }
}
